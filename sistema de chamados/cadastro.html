<!--Tela 03-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
    <title>Cadastrar usuario</title>
</head>

<body class="d-flex align-items-left py-4">
    <main class="form-container w-100 m-auto">
        <!--Formulario de cadastro de usuario novo-->
        <form class="form-signin">
            <h1 class="h3 fw-normal">Criar Conta</h1>
                <p>Preencha com seus dados para se cadastrar</p>
        <div>
            <label class="label-form" for="form-label" >Nome Completo</label>
                <input class="form-control" type="text" id="input_casdastro" placeholder="Nome"> <!--usuario entra com  nome completo-->
            <label class="label-form" for="form-label">Email</label>
                <input class="form-control" type="email" id="input_cadastro_email" placeholder="Email">        <!--usuario entra com a email-->
                <div class="mt-3 row g-8">
                    <div class="col">
                        Telefone <input type="number" class="form-control" placeholder="(00)0000-0000">
                    </div>
                    <div class="mb-3 col">
                        CPF <input type="number" class="form-control" placeholder="CPF">
                    </div>
                </div>
                <label class="label-form" for="form-label">Senha</label>
                <input class="form-control" type="password" id="input_casdastro_senha" placeholder="Senha">
                <div class="d-grid gap-2 col-6 mx-auto">
                <button class="mb-3 mt-3 btn btn-dark">Cadastrar</button> <!--botão de cadastro de dados-->
            </div>
        </div>
        </form>
    </main>

</body>

</html>
