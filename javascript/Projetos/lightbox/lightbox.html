<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/lightbox.css">
	<title>Lightbox com HTML, CSS, Bootstrap e Javascript</title>
</head>
<body>
	<main class="principal">

		<!-- Linha para os cachorros -->
		<div class="linha">
			<div class="coluna">
				<img src="images/imagem-1.avif" onclick="abreLightbox();vaParaSlide(1)" class="sombra" alt="Morango"/>
			</div>
			<div class="coluna">
				<img src="images/imagem-1.avif" onclick="abreLightbox();vaParaSlide(1)" class="sombra" alt="Morango"/>
			</div>
			<div class="coluna">
				<img src="images/imagem-1.avif" onclick="abreLightbox();vaParaSlide(1)" class="sombra" alt="Morango"/>
			</div>
		</div>


		<div class="limpa"></div>


		<!-- Linha para os gatos -->
		<div class="linha">
			<div class="coluna">
				<img src="images/imagem-2.avif" onclick="abreLightbox();vaParaSlide(4)" class="sombra" alt="Cereja" />
			</div>
			<div class="coluna">
			    <img src="images/imagem-2.avif" onclick="abreLightbox();vaParaSlide(5)" class="sombra" alt="Cereja" />
			</div>
			<div class="coluna">
			    <img src="images/imagem-2.avif" onclick="abreLightbox();vaParaSlide(6)" class="sombra" alt="Cereja" />
			</div>
		</div>

		<div id="Lightbox" class="modal">
		    <span class="fechar" onclick="fechaLightbox()">&times;</span>
		    <div class="modal-conteudo">
		    	<!-- Cachorros -->
		    	<div class="slide">
		
			<img src="images/imagem-1.avif" alt="Morango"/>

		      	</div>
		      	<div class="slide">
			<img src="images/imagem-1.avif" alt="Morango"/>
		      	</div>    
		      	<div class="slide">
			<img src="images/imagem-1.avif" alt="Morango"/>
		      	</div>

		      	<!-- Gatos -->
		      	<div class="slide">
		        	<img src="images/imagem-2.avif" alt="Cereja" />
		      	</div>
		      	<div class="slide">
		        	<img src="images/imagem-2.avif" alt="Cereja" />
		      	</div>
		      	<div class="slide">
		        	<img src="images/imagem-2.avif" alt="Cereja" />
		      	</div>
		    
		      	<a class="anterior" onclick="trocaSlide(-1)">&#10094;</a>
		      	<a class="proximo" onclick="trocaSlide(1)">&#10095;</a>
		    </div> 
		</div>
		 
	</main>

	<script src="js/lightbox.js"></script>

</body>
</html>
