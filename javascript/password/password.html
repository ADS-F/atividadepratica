<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Mostrando e ocultando senhas usando JavaScript</title>
</head>
<body>
    <div class="container"><!--organiza o espaço do conteudo -->
        <label for="passes">Entre com a sua senha: </label> <!--rotulo-->
        <div class="input-container">
            <input id="passes" placeholder="senha" type="password"> <!--entrada de dados do rotulo-->
            <span class="eye-icon" id="eye-icon">🔓</span> <!--icone para alterar a visibilidade da senha-->
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
