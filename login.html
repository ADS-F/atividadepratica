<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
    <title>Login</title>
</head>

<body class="d-flex align-items-left py-4">
    <main class="form-container w-100 m-auto">
        <!--Formulario de entrada-->
        <form class="form-signin">
            <h1 class="h3 fw-normal">Entrar</h1>
                <p>Acesse com seu email e senha</p>
        <div>
            <label class="label-form" for="form-label" >Email</label>
                <input class="form-control" type="email" id="input_Email_sign" placeholder="email@email.com"> <!--usuario entra com  email-->
            <label class="label-form" for="form-label">Senha</label>
                <input class="form-control" type="password" id="input_senha_sign" placeholder="senha">        <!--usuario entra com a senha-->
            
                <div class="d-grid gap-2 col-6 mx-auto">
                <button class="mb-3 mt-3 btn btn-dark">Entrar</button> <!--botão de entrada-->
            </div>
                <p class="text-center">Não tem conta ainda? <a href="#"> Cadastre-se</a></p> <!--link de cadastro para nao usuarios-->

        </div>

        </form>
    </main>

</body>

</html>
